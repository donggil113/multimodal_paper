# Indicative 2024 United States list prices, turnaround times and an
# invasiveness score on [0, 1]. These are defaults, not claims: the reduction
# study is reported as a frontier so a reader with a different fee schedule can
# read off their own operating point, and `cost_mode: throughput` reprices the
# whole analysis in minutes rather than dollars.
#
# Replace with a local schedule (e.g. Korean NHIS relative value units) before
# quoting any absolute saving.

