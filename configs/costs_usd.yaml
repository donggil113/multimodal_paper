vitals:       {cost_usd: 0,   turnaround_min: 0,   invasiveness: 0.00}
meds:         {cost_usd: 0,   turnaround_min: 0,   invasiveness: 0.00}
notes:        {cost_usd: 0,   turnaround_min: 0,   invasiveness: 0.00}
