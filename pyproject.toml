[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infogain"
version = "0.1.0"
description = "INFOGAIN: patient-level information-value decomposition of multimodal diagnostic testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
raw = ["wfdb>=4.1", "pydicom>=2.4", "Pillow>=10.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["infogain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
